version: '3.8'

services:
  orabbit-admin-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ORABBIT_BACKEND_URL: ${VITE_ORABBIT_BACKEND_URL:-http://localhost:8080}
    container_name: orabbit-admin-ui
    restart: unless-stopped
    ports:
      - "${ORABBIT_UI_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production
