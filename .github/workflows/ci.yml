name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build Bundle
        run: npm run build

      - name: Run Test Suite (if configured)
        run: |
          if npm run | grep -q "test"; then
            npm test -- --run
          else
            echo "No test script found, skipping."
          fi

  docker-build:
    name: Docker Image Verification
    needs: build-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: orabbit-admin-ui:test
          load: true

      - name: Run Container & Verify Healthcheck
        run: |
          docker run -d --name orabbit-test-container -p 8080:80 orabbit-admin-ui:test
          sleep 3
          curl -f http://localhost:8080/healthz || (docker logs orabbit-test-container && exit 1)
          docker stop orabbit-test-container
